org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.workers.max=2
android.useAndroidX=true

# NÃO defina `android.aapt2FromMavenOverride` aqui.
#
# A configuração do AGP por padrão baixa o AAPT2 do Maven
# (com.android.tools.build:aapt2) na versão certa para a plataforma, e é o
# que funciona em qualquer runner.
#
# Este arquivo usava apontar para `/usr/bin/aapt2`, que só existe em
# máquinas com o SDK do Debian empacotado (symlink em /usr/bin). No runner
# Linux x86_64 do CI esse caminho não existe e o build quebrava com
# "Specified AAPT2 executable does not exist: /usr/bin/aapt2".
#
# Se você precisa do AAPT2 do sistema numa máquina específica, coloque o
# override em `~/.gradle/gradle.properties` (fora do repositório), que tem
# prioridade maior que este arquivo.

# ------------------------------------------------------------------
# Snapshot AOT: desliga a deduplicação de instruções
# ------------------------------------------------------------------
# `dedup_instructions` é uma otimização do gen_snapshot sem efeito funcional,
# mas o deduplicador do DartVM tem histórico de gerar código que o motor não
# consegue decodificar em alguns devices ARM, derrubando o app logo na
# abertura com falha de carga do snapshot. O sintoma aparece citado junto dos
# termos "product mode" e "compressed-pointers", porque são os feature flags
# gravados no cabeçalho do snapshot que a VM imprime ao recusá-lo.
#
# Desligar a flag custa um pouco de tamanho de libapp.so e tempo de AOT, e
# não muda comportamento. Reverter é remover esta linha.
#
# O FlutterPlugin lê esta propriedade e repassa os argumentos ao gen_snapshot
# (packages/flutter_tools/gradle/src/main/kotlin/FlutterPlugin.kt).
extra-gen-snapshot-options=--no-dedup_instructions
