name: klay_k
description: "O aplicativo de vídeos curtos KLAY K inspirado no Kwai."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  video_player: ^2.9.5
  share_plus: ^10.1.4
  http: ^1.3.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.0
  supabase_flutter: ^2.17.2
  livekit_client: ^2.11.0
  image_picker: ^1.2.3
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.3.1
  flutter_tts: ^4.2.5
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  intl: any
  camera: ^0.12.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.9.2

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/klay_k_icon.png"
  adaptive_icon_background: "#0E0E16"
  adaptive_icon_foreground: "assets/images/klay_k_icon.png"
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/
    - assets/images/