name: KLAY K - Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-release:
    name: Build KLAY K Release ARM64
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Baixar código do KLAY K
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Flutter 3.38.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: stable
          cache: true

      - name: Verificar ambiente
        run: |
          echo "Arquitetura da máquina:"
          uname -m
          echo ""
          flutter --version
          echo ""
          dart --version
          echo ""
          java -version

      - name: Limpar builds antigos
        run: |
          flutter clean
          rm -rf build
          rm -rf .dart_tool

      - name: Instalar dependências
        run: |
          flutter pub get

      - name: Baixar artefatos Android do Flutter
        run: |
          flutter precache --android

      - name: Verificar Flutter
        run: |
          flutter doctor -v

      - name: Gerar KLAY K Release ARM64
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64

      - name: Verificar APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK encontrado:"
          ls -lh "$APK"

          echo ""
          echo "Arquiteturas dentro do APK:"
          unzip -l "$APK" | grep "lib/"

      - name: Verificar libapp.so ARM64
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          unzip -p "$APK" lib/arm64-v8a/libapp.so > /tmp/libapp.so

          if [ ! -s /tmp/libapp.so ]; then
            echo "ERRO: libapp.so ARM64 não encontrada."
            exit 1
          fi

          echo "libapp.so ARM64 encontrada."
          file /tmp/libapp.so

      - name: Verificar assinatura
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose "$APK"
          else
            echo "apksigner não encontrado no PATH."
            echo "A verificação automática da assinatura foi ignorada."
          fi

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: KLAY-K-release-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14