name: KLAY K - Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-release:
    name: Build KLAY K Release ARM64
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Baixar código do KLAY K
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Flutter 3.38.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: stable
          cache: true

      - name: Verificar ambiente
        run: |
          echo "Arquitetura da máquina:"
          uname -m
          echo ""
          flutter --version
          echo ""
          dart --version
          echo ""
          java -version

      - name: Limpar builds antigos
        run: |
          flutter clean
          rm -rf build
          rm -rf .dart_tool

      - name: Instalar dependências
        run: |
          flutter pub get

      - name: Baixar artefatos Android do Flutter
        run: |
          flutter precache --android

      - name: Verificar Flutter
        run: |
          flutter doctor -v

      # O keystore e o key.properties vivem apenas fora do Git (android/.gitignore
      # cobre key.properties, *.jks e *.keystore). Sem este passo o
      # build.gradle.kts carrega um Properties vazio, o signingConfig "release"
      # fica sem storeFile e o :app:packageRelease falha no empacotamento.
      - name: Restaurar assinatura de release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          ausentes=0
          for var in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "ERRO: secret $var ausente ou vazio."
              ausentes=1
            fi
          done

          if [ "$ausentes" -ne 0 ]; then
            echo ""
            echo "Configure em Settings > Secrets and variables > Actions:"
            echo "  KEYSTORE_BASE64   -> base64 do .jks de release"
            echo "  KEYSTORE_PASSWORD -> storePassword"
            echo "  KEY_ALIAS         -> keyAlias"
            echo "  KEY_PASSWORD      -> keyPassword"
            exit 1
          fi

          # umask antes de criar qualquer arquivo impede janela de permissao
          # aberta entre a criacao e o chmod.
          umask 077

          # O keystore tem que cair em android/app/ porque e onde o modulo Android
          # procura; o storeFile gerado abaixo aponta para esse caminho absoluto.
          #
          # O secret chega como foi colado. Se o Base64 foi gerado sem -w0, ou
          # colado com quebras/ espacos, `base64 --decode` aborta com
          # "invalid input" e o log nao diz qual era o problema. Normalizar
          # primeiro resolve os dois casos e o `if !` transforma a falha em
          # mensagem util em vez de um "exit code 1" sem contexto.
          clean_b64=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')
          chars=${#clean_b64}

          if [ "$chars" -eq 0 ]; then
            echo "ERRO: KEYSTORE_BASE64 ficou vazio apos remover espacos."
            exit 1
          fi

          if ! printf '%s' "$clean_b64" | base64 --decode \
                > android/app/klayk-upload.jks 2>/tmp/b64.err; then
            echo "ERRO: KEYSTORE_BASE64 nao decodifica como Base64."
            echo "      motivo : $(cat /tmp/b64.err)"
            echo "      tamanho: $chars caracteres"
            echo ""
            echo "Regere o secret com:"
            echo "  base64 -w0 android/app/klayk-upload.jks"
            exit 1
          fi

          chmod 600 android/app/klayk-upload.jks
          echo "Keystore restaurado: $(stat -c%s android/app/klayk-upload.jks) bytes de $chars caracteres Base64."

          # build.gradle.kts le o arquivo com rootProject.file("key.properties"),
          # que resolve para android/key.properties (raiz do projeto android).
          # storeFile recebe caminho absoluto em vez do relativo usado no
          # key.properties local: assim nao depende de como file() resolve
          # dentro do bloco android, que muda entre versoes do AGP.
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$GITHUB_WORKSPACE/android/app/klayk-upload.jks"
          } > android/key.properties
          chmod 600 android/key.properties

          echo ""
          echo "Permissões:"
          ls -l android/app/klayk-upload.jks android/key.properties

          # Confere o formato e se o alias existe antes de gastar minutos
          # compilando. Abrir pelo storepass primeiro separa os dois erros
          # possíveis: senha errada impede qualquer listagem; senha certa com
          # alias errado mostra a lista e deixa o alias correto visível.
          KEYTOOL="${JAVA_HOME:+$JAVA_HOME/bin/}keytool"
          command -v "$KEYTOOL" >/dev/null 2>&1 || KEYTOOL=keytool

          if ! "$KEYTOOL" -list \
                -keystore android/app/klayk-upload.jks \
                -storepass "$KEYSTORE_PASSWORD" \
                >/tmp/ks.txt 2>/tmp/ks.err; then
            echo "ERRO: nao consegui abrir o keystore."
            echo "  keytool: $(head -1 /tmp/ks.err)"
            echo ""
            echo "Se a mensagem citar senha, KEYSTORE_PASSWORD nao corresponde a este keystore."
            exit 1
          fi

          aliases=$(cut -d, -f1 /tmp/ks.txt \
            | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
            | grep -vE "^(Your keystore contains|Keystore type|Certificate fingerprints|Entry type|$)")

          echo "Alias presentes no keystore:"
          echo "$aliases" | sed 's/^/  - /'

          if ! echo "$aliases" | grep -qxF "$KEY_ALIAS"; then
            echo ""
            echo "ERRO: KEY_ALIAS='$KEY_ALIAS' nao existe neste keystore."
            echo "      Use um dos alias listados acima, sem aspas."
            exit 1
          fi

          echo ""
          echo "Keystore validado. Alias: $KEY_ALIAS"

      - name: Gerar KLAY K Release ARM64
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64

      - name: Verificar APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK encontrado:"
          ls -lh "$APK"

          echo ""
          echo "Arquiteturas dentro do APK:"
          unzip -l "$APK" | grep "lib/"

      - name: Verificar libapp.so ARM64
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          unzip -p "$APK" lib/arm64-v8a/libapp.so > /tmp/libapp.so

          if [ ! -s /tmp/libapp.so ]; then
            echo "ERRO: libapp.so ARM64 não encontrada."
            exit 1
          fi

          echo "libapp.so ARM64 encontrada."
          file /tmp/libapp.so

      - name: Verificar assinatura
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"

          # O setup-java não põe o build-tools no PATH, então procurar apenas por
          # "apksigner" no PATH escondia a falha de verificação. Um Release
          # assinado é requisito de publicação: não pode ser um passo opcional.
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" \
            -name apksigner -type f 2>/dev/null | sort -V | tail -1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERRO: apksigner não encontrado em \$ANDROID_HOME/build-tools."
            exit 1
          fi

          echo "Usando: $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          echo ""
          echo "ABIs presentes no APK (deve ser apenas arm64-v8a):"
          unzip -l "$APK" | awk '/lib\// {print $4}' | cut -d/ -f2 | sort -u

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: KLAY-K-release-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      # O runner é descartado, mas apagar explicitamente evita que o keystore
      # entre no cache do post-job ou em qualquer passo de diagnóstico.
      - name: Descartar material de assinatura
        if: always()
        run: |
          rm -f android/app/klayk-upload.jks android/key.properties
          echo "Keystore e key.properties removidos do workspace."